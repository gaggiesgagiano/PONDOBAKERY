{% with n=request.resolver_match.url_name %}
<div class="chips subnav no-print" style="margin:0">
  <a class="chip {% if n == 'daily' or 'daily_' in n %}on{% endif %}" href="{% url 'sales:daily' %}">Daily sales</a>
  <a class="chip {% if 'cashup' in n %}on{% endif %}" href="{% url 'sales:cashups' %}">Cash-ups</a>
  <a class="chip {% if 'expense' in n %}on{% endif %}" href="{% url 'sales:expenses' %}">Expenses</a>
  <a class="chip {% if 'daysales' in n %}on{% endif %}" href="{% url 'sales:daysales_list' %}">Product sales</a>
  {% if can.costs %}<a class="chip {% if n == 'cashier_report' %}on{% endif %}" href="{% url 'sales:cashier_report' %}">Over &amp; short per cashier</a>{% endif %}
  {% if can.costs %}<a class="chip {% if n == 'report' %}on{% endif %}" href="{% url 'sales:report' %}">Month summary</a>{% endif %}
  {% if can.owner %}<a class="chip {% if 'setup' in n %}on{% endif %}" href="{% url 'sales:setup' %}">Payment &amp; expense types</a>{% endif %}
</div>
{% endwith %}
