{% with n=request.resolver_match.url_name %}
<div class="chips subnav no-print" style="margin:0">
  <a class="chip {% if n == 'register' or n == 'item' or n == 'item_new' %}on{% endif %}" href="{% url 'equipment:register' %}">Register</a>
  <a class="chip {% if n == 'count' %}on{% endif %}" href="{% url 'equipment:count' %}">Monthly count</a>
  {% if can.costs %}<a class="chip {% if n == 'depreciation' %}on{% endif %}" href="{% url 'equipment:depreciation' %}">Depreciation</a>{% endif %}
  {% if can.owner %}<a class="chip {% if n == 'lists' %}on{% endif %}" href="{% url 'equipment:lists' %}">Categories &amp; places</a>{% endif %}
</div>
{% endwith %}
