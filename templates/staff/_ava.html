{% if e.photo %}<img class="ava{% if big %} big{% endif %}" src="{% url 'staff:photo' e.pk %}?v={{ e.photo_v }}" alt="{% if big %}Photo of {{ e.name }}{% endif %}" loading="lazy">{% else %}<span class="ava c-{{ e.avatar_colour }}{% if big %} big{% endif %}" aria-hidden="true">{{ e.initials }}</span>{% endif %}
