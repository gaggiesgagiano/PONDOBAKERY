{% with n=request.resolver_match.url_name %}
<div class="chips subnav no-print" style="margin:0">
  <a class="chip {% if n == 'month_end' %}on{% endif %}" href="{% url 'reports:month_end' %}">Month-end report</a>
  <a class="chip" href="{% url 'reports:accountant' %}" target="_blank">Accountant report</a>
  <a class="chip {% if n == 'stock' %}on{% endif %}" href="{% url 'reports:stock' %}">Stock results (COGS)</a>
  <a class="chip {% if n == 'archive' %}on{% endif %}" href="{% url 'reports:archive' %}">Month archive</a>
</div>
{% endwith %}
