{% with n=request.resolver_match.url_name %}
<div class="chips subnav no-print" style="margin:0">
  <a class="chip {% if n == 'home' %}on{% endif %}" href="{% url 'stock:home' %}">Stock levels</a>
  <a class="chip {% if 'order' in n %}on{% endif %}" href="{% url 'stock:orders' %}">Orders</a>
  <a class="chip {% if 'grv' in n %}on{% endif %}" href="{% url 'stock:grvs' %}">Receiving (GRV)</a>
  <a class="chip {% if 'count' in n %}on{% endif %}" href="{% url 'stock:counts' %}">Stock take</a>
  <a class="chip {% if 'supplier' in n %}on{% endif %}" href="{% url 'stock:suppliers' %}">Suppliers</a>
</div>
{% endwith %}
