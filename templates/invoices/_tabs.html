{% with n=request.resolver_match.url_name %}
<div class="chips subnav no-print" style="margin:0">
  <a class="chip {% if n == 'list' or n == 'doc' or n == 'new' or n == 'edit' %}on{% endif %}" href="{% url 'invoices:list' %}">Quotes, pro-formas &amp; invoices</a>
  <a class="chip {% if 'deliver' in n %}on{% endif %}" href="{% url 'invoices:deliveries' %}">Deliveries</a>
  <a class="chip {% if 'driver' in n %}on{% endif %}" href="{% url 'invoices:drivers' %}">Drivers</a>
  <a class="chip {% if 'customer' in n %}on{% endif %}" href="{% url 'invoices:customers' %}">Customers</a>
</div>
{% endwith %}
