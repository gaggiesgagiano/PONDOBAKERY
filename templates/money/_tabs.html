{% with n=request.resolver_match.url_name %}
<div class="chips subnav no-print" style="margin:0">
  <a class="chip {% if n == 'home' %}on{% endif %}" href="{% url 'money:home' %}">Overview</a>
  <a class="chip {% if n == 'book' or n == 'bank_check' or 'entry' in n %}on{% endif %}" href="{% url 'money:home' %}#accounts">Cash book</a>
  <a class="chip {% if n == 'creditors' or n == 'statement' or n == 'pay' or n == 'payment' %}on{% endif %}" href="{% url 'money:creditors' %}">Suppliers we owe</a>
  <a class="chip {% if n == 'vat' %}on{% endif %}" href="{% url 'money:vat' %}">VAT</a>
  <a class="chip {% if n == 'balance' %}on{% endif %}" href="{% url 'money:balance' %}">Balance sheet</a>
  <a class="chip" href="{% url 'reports:month_end' %}">Month-end (profit)</a>
  {% if can.owner %}<a class="chip {% if 'account' in n %}on{% endif %}" href="{% url 'money:accounts' %}">Accounts set-up</a>{% endif %}
</div>
{% endwith %}
