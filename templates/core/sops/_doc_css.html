<style>
  .sopdoc{font-size:15px;line-height:1.55;color:#2e1610}
  .sopdoc h3{font-size:16px;color:#7a1315;margin:14px 0 4px}
  .sopdoc h3:first-child{margin-top:0}
  .sopdoc p{margin:4px 0}
  .sopdoc ol,.sopdoc ul{margin:4px 0 8px;padding-left:24px}
  .sopdoc li{margin:3px 0}
  .sopdoc ol li::marker{font-weight:800;color:#218d80}
  .sopdoc table{border-collapse:collapse;margin:6px 0 10px;font-size:14px}
  .sopdoc th{background:#7a1315;color:#fff3d7;text-align:left;padding:5px 10px}
  .sopdoc td{border-bottom:1px solid #ebd3b2;padding:5px 10px}
  .sopmeta{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 18px;font-size:13px}
  .sopmeta div span{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted,#7c5a4a)}
  .chip.draft{background:#fde3c9;color:#9c3d17;border-color:#fde3c9}
  .chip.ok{background:#d8efea;color:#13574f;border-color:#d8efea}
  .chip.due{background:#fbd9d6;color:#b3261e;border-color:#fbd9d6}
</style>
